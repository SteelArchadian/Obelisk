[package]
name = "obelisk-core"
version = "0.1.0"
license = "LGPL-3.0-only"
edition = "2024"
description = "Obelisk's Prism Launcher data layer (no UI)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
flate2 = "1"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
iroh = "1.4"
iroh-dns = "1.4"
tempfile = "3"
tokio = { version = "1", features = ["time", "sync", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
keyring = { version = "3", features = ["windows-native"] }
