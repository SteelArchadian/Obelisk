[package]
name = "obelisk"
version = "0.2.49"
description = "Obelisk - a CurseForge-style front end for Prism Launcher"
authors = ["SteelArchadian"]
license = "LGPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "obelisk_lib"
crate-type = ["rlib"]  # cdylib/staticlib are for mobile; cdylib exceeds MinGW's export limit

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
obelisk-core = { path = "../../core" }
trash = "5"
notify = { version = "6", default-features = false }
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.56"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["time", "sync", "io-util", "macros"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
uiautomation = "0.25.1"



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
